name: CI

# Every push to a pull request, and every push to main. On main it also pushes the production
# images, tagged with the commit, for deploy.yml to release.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run for the previous one; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The ruff version is pinned: newer versions enable more rules by default.
env:
  RUFF_VERSION: "0.16.10"
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/prepza
  # Only main pushes images: pull requests just check that they build.
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  lint:
    name: python lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@${{ env.RUFF_VERSION }} check services packages
      - run: uvx ruff@${{ env.RUFF_VERSION }} format --check services packages

  tests:
    name: ${{ matrix.path }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - services/library
          - services/generation
          - services/rounds
          - services/companies
          - services/notifications
          - services/billing
          - packages/common
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: ${{ matrix.path }}
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    name: frontend lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  images:
    name: ${{ matrix.name }} production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GitHub sign the token Google exchanges for the deploy account (no stored key).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The API images are built from the repo root, as they include packages/common.
          - { name: library, context: ., file: services/library/Dockerfile }
          - { name: generation, context: ., file: services/generation/Dockerfile }
          - { name: rounds, context: ., file: services/rounds/Dockerfile }
          - { name: companies, context: ., file: services/companies/Dockerfile }
          - { name: billing, context: ., file: services/billing/Dockerfile }
          - { name: notifications, context: ., file: services/notifications/Dockerfile }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - if: env.PUBLISH == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: env.PUBLISH == 'true'
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          # Cloud Run runs x86.
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # The frontend bakes its public settings in at build time: the real ones for the images
          # main pushes, placeholders for pull requests.
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ env.PUBLISH == 'true' && vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'demo-api-key' }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ env.PUBLISH == 'true' && vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'demo-prepza.firebaseapp.com' }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ env.PUBLISH == 'true' && vars.GCP_PROJECT_ID || 'demo-prepza' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.PUBLISH == 'true' && vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ env.PUBLISH == 'true' && 'production' || '' }}

  smoke:
    name: smoke test (whole stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The example settings run everything locally: the Firebase emulator, mailpit, no OpenAI key.
      - run: cp .env.example .env
      - run: docker compose up --build -d
      # Waits for the services and the frontend's first compile, then checks pages and /ready.
      - name: Smoke test
        run: |
          for attempt in $(seq 1 40); do
            if ./scripts/tests/smoke.sh; then
              exit 0
            fi

            sleep 15
          done

          exit 1
      # Each service's tests/integration, against the stack's real Postgres and Redis.
      - name: Integration tests
        run: ./scripts/tests/integration.sh
      # The signed-out pages in a real browser (Playwright's image), on desktop and phone sizes.
      - name: Page tests
        run: ./scripts/tests/pages.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
