name: Deploy

# Ships main to Google Cloud once CI has passed on it. Infrastructure changes go through Terraform
# (infra/); this only builds images, runs migrations and moves services to the new images.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time, in order.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Lets GitHub sign the token Google exchanges for the deploy account (no stored key).
  id-token: write

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/prepza
  TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  images:
    name: ${{ matrix.name }} image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: library, context: ., file: services/library/Dockerfile }
          - { name: generation, context: ., file: services/generation/Dockerfile }
          - { name: rounds, context: ., file: services/rounds/Dockerfile }
          - { name: companies, context: ., file: services/companies/Dockerfile }
          - { name: billing, context: ., file: services/billing/Dockerfile }
          - { name: notifications, context: ., file: services/notifications/Dockerfile }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          # Cloud Run runs x86.
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ env.TAG }}
          cache-from: type=gha,scope=deploy-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=deploy-${{ matrix.name }}
          # The frontend bakes its public settings in at build time.
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production

  deploy:
    name: migrate and deploy
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # Migrations run before any service moves, so new code never meets an old schema.
      - name: Migrations
        run: |
          for db in library generation rounds companies billing; do
            gcloud run jobs update "$db-migrate" --image="$REGISTRY/$db:$TAG" --region="${{ vars.GCP_REGION }}" --quiet
            gcloud run jobs execute "$db-migrate" --region="${{ vars.GCP_REGION }}" --wait --quiet
          done
      - name: Services
        run: |
          deploy() {
            gcloud run services update "$1" --image="$REGISTRY/$2:$TAG" --region="${{ vars.GCP_REGION }}" --quiet
          }

          deploy library library
          deploy generation generation
          deploy generation-worker generation
          deploy rounds rounds
          deploy companies companies
          deploy billing billing
          deploy notifications notifications
          deploy frontend frontend
      - name: Smoke test
        run: ./scripts/tests/smoke.sh "${{ vars.SITE_URL }}"
