# Weekly pull requests that update the pinned base images (tag and digest), GitHub Actions
# (pinned by commit) and the frontend's and services' packages (their lock files). Merge after CI
# passes; close to skip a version.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /database
      - /firebase
      - /frontend
      - /services/ats
      - /services/api
      - /services/assistant
      - /services/billing
      - /services/companies
      - /services/generation
      - /services/library
      - /services/notifications
      - /services/rounds
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    # Minor and patch updates only: a new major (Node 26, Python 3.15, Postgres 19) is planned by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directories:
      - /packages/common
      - /services/api
      - /services/assistant
      - /services/ats
      - /services/billing
      - /services/companies
      - /services/generation
      - /services/library
      - /services/notifications
      - /services/rounds
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
