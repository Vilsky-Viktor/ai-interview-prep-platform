# The site, the gateway in front of it and the services (http://localhost:8090), and the
# scheduled jobs.

services:
  frontend:
    restart: unless-stopped
    build:
      context: frontend
      target: dev
    environment:
      # Server-side rendering calls the API through the gateway.
      API_URL: http://gateway
      SITE_URL: ${SITE_URL:-http://localhost:8090}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    volumes:
      - ./frontend:/frontend
      - frontend-modules:/frontend/node_modules
      - frontend-next:/frontend/.next
  gateway:
    restart: unless-stopped
    image: nginx:1.29-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      library:
        condition: service_healthy
      generation:
        condition: service_healthy
      rounds:
        condition: service_healthy
      companies:
        condition: service_healthy
      frontend:
        condition: service_started

  # Local stand-in for Cloud Scheduler (see scripts/local/crontab).
  scheduler:
    restart: unless-stopped
    image: alpine:3.22
    # Cron reads only a crontab owned by root, so the mounted one is copied into place.
    command: sh -c "apk add --no-cache curl >/dev/null && cp /crontab /etc/crontabs/root && crond -f -l 2"
    volumes:
      - ./scripts/local/crontab:/crontab:ro
    depends_on:
      generation-worker:
        condition: service_healthy
      companies:
        condition: service_healthy

volumes:
  frontend-modules:
  frontend-next:
