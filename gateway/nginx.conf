map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;

    # Docker's DNS. Upstreams are variables so nginx re-resolves them after containers are
    # recreated instead of keeping the IPs it saw at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers on every response. The frontend adds its own Content-Security-Policy,
    # which needs a fresh nonce per page. HSTS only takes effect over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Service-to-service endpoints are never reachable from outside.
    location ~ ^/api/[^/]+/internal/ {
        return 404;
    }

    location /api/library/ {
        set $upstream library:8000;
        rewrite ^/api/library/(.*)$ /$1 break;
        # Above library's own 120s wait on question re-generation.
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    location /api/generate/ {
        set $upstream generation:8000;
        rewrite ^/api/generate/(.*)$ /$1 break;
        # Generation calls wait on the LLM, which can take over a minute.
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    location /api/rounds/ {
        set $upstream rounds:8000;
        rewrite ^/api/rounds/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /api/companies/ {
        set $upstream companies:8000;
        rewrite ^/api/companies/(.*)$ /$1 break;
        # Above companies' own 120s wait on question re-generation.
        proxy_read_timeout 150s;
        # A report's PDF, base64 in JSON (the service's own limit is 2 MB).
        client_max_body_size 2m;
        proxy_pass http://$upstream;
    }

    location /api/billing/ {
        set $upstream billing:8000;
        rewrite ^/api/billing/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # ATS integrations, and the webhooks Workable and Greenhouse send.
    location /api/ats/ {
        set $upstream ats:8000;
        rewrite ^/api/ats/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # The public API (companies' keys) and the company's API page: /api/v1/... is the api service.
    location /api/v1/ {
        set $upstream api:8000;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # The bell (its live stream included) and Resend's webhooks (bounces, complaints). The stream
    # sends a heartbeat every 20 seconds, well inside the read timeout.
    location /api/notifications/ {
        set $upstream notifications:8000;
        rewrite ^/api/notifications/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://$upstream;
    }

    # The in-app assistant: answers stream as server-sent events while its tools call the other
    # services (a turn takes up to 90 seconds), and voice messages are uploaded (up to 2 MB).
    location /api/assistant/ {
        set $upstream assistant:8000;
        rewrite ^/api/assistant/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
        client_max_body_size 3m;
        proxy_pass http://$upstream;
    }

    # AI apps (Claude, ChatGPT, ...): the assistant's MCP endpoint and its OAuth authorization
    # server (metadata, /authorize, /token, /register, /revoke) live at the site's root, where
    # the OAuth and MCP specs look for them. Exact paths only, so they never take a frontend
    # page: no page may use these paths. Proxied as they are, without a rewrite.
    location ~ ^/(mcp|authorize|token|register|revoke|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource(/mcp)?)$ {
        set $upstream assistant:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    location / {
        set $upstream frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_pass http://$upstream;
    }
}
