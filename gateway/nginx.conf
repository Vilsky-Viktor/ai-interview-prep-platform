map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;

    # Docker's DNS. Upstreams are variables so nginx re-resolves them after containers are
    # recreated instead of keeping the IPs it saw at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers on every response. The frontend adds its own Content-Security-Policy,
    # which needs a fresh nonce per page. HSTS only takes effect over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Service-to-service endpoints are never reachable from outside.
    location ~ ^/api/[^/]+/internal/ {
        return 404;
    }

    location /api/library/ {
        set $upstream library:8000;
        rewrite ^/api/library/(.*)$ /$1 break;
        # Above library's own 120s wait on question re-generation.
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    location /api/generate/ {
        set $upstream generation:8000;
        rewrite ^/api/generate/(.*)$ /$1 break;
        # Generation calls wait on the LLM, which can take over a minute.
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    location /api/rounds/ {
        set $upstream rounds:8000;
        rewrite ^/api/rounds/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /api/companies/ {
        set $upstream companies:8000;
        rewrite ^/api/companies/(.*)$ /$1 break;
        # Above companies' own 120s wait on question re-generation.
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    location /api/billing/ {
        set $upstream billing:8000;
        rewrite ^/api/billing/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # Resend's webhooks (bounces, complaints).
    location /api/notifications/ {
        set $upstream notifications:8000;
        rewrite ^/api/notifications/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location / {
        set $upstream frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_pass http://$upstream;
    }
}
