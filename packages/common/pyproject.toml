[project]
name = "prepza-common"
version = "0.1.0"
description = "Code shared by prepza's services: sign-in, service tokens, logging, database and HTTP setup."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "sentry-sdk[fastapi]>=2.71.0",
    "sqlalchemy[asyncio]>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
