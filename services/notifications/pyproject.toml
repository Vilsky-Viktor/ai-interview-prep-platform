[project]
name = "notifications"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "prepza-common",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
prepza-common = { path = "../../packages/common", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
