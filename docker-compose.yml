# Local development only. Every app image is built from its Dockerfile's `dev` target, with the
# source mounted so the servers reload on change. Production images come from the `prod` targets
# (see README); deploy them with your own orchestration.

x-firebase-env: &firebase-env
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
  # While set, the services accept unsigned tokens from the Auth emulator. Never in production.
  FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST}
  # Development only: serves /docs and /openapi.json, which `pnpm api-types` reads.
  API_DOCS: "true"
  # Error reports; nothing is sent while SENTRY_DSN is empty.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

x-service: &service
  restart: unless-stopped
  environment:
    <<: *firebase-env
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')
    interval: 10s
    timeout: 3s
    retries: 3

# Invite email limits, shared by library (shares) and companies (candidate invites).
x-email-limits: &email-limits
  EMAIL_HOURLY_LIMIT: ${EMAIL_HOURLY_LIMIT:-30}
  EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-200}
  EMAIL_RECIPIENT_DAILY_LIMIT: ${EMAIL_RECIPIENT_DAILY_LIMIT:-3}

x-library-env: &library-env
  <<: [*firebase-env, *email-limits]
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/library
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  ROUNDS_URL: http://rounds:8000
  GENERATION_URL: http://generation:8000
  COMPANIES_URL: http://companies:8000

x-rounds-env: &rounds-env
  <<: *firebase-env
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/rounds
  REDIS_URL: redis://redis:6379
  LIBRARY_URL: http://library:8000
  SERVICE_SECRET: ${SERVICE_SECRET}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
  LLM_LIMIT: ${LLM_LIMIT:-400}
  LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
  LLM_WINDOW_SECONDS: ${LLM_WINDOW_SECONDS:-3600}

x-companies-env: &companies-env
  <<: [*firebase-env, *email-limits]
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/companies
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  GENERATION_URL: http://generation:8000
  LIBRARY_URL: http://library:8000
  ROUNDS_URL: http://rounds:8000

# Each service's mounted source; migrations read it too, so new ones run without a rebuild.
x-library-source: &library-source
  - ./services/library/app:/services/library/app
  - ./services/library/migrations:/services/library/migrations
  - ./services/library/alembic.ini:/services/library/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-generation-source: &generation-source
  - ./services/generation/app:/services/generation/app
  - ./services/generation/migrations:/services/generation/migrations
  - ./services/generation/alembic.ini:/services/generation/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-rounds-source: &rounds-source
  - ./services/rounds/app:/services/rounds/app
  - ./services/rounds/migrations:/services/rounds/migrations
  - ./services/rounds/alembic.ini:/services/rounds/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-companies-source: &companies-source
  - ./services/companies/app:/services/companies/app
  - ./services/companies/migrations:/services/companies/migrations
  - ./services/companies/alembic.ini:/services/companies/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

# Runs a service's migrations once, before its API starts, so replicas never race on them.
x-migrate: &migrate
  restart: "no"
  command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
  depends_on:
    postgres:
      condition: service_healthy

x-generation-env: &generation-env
  <<: *firebase-env
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/generation
  REDIS_URL: redis://redis:6379
  LIBRARY_URL: http://library:8000
  SERVICE_SECRET: ${SERVICE_SECRET}
  QUESTIONS_PER_TOPIC: ${QUESTIONS_PER_TOPIC:-100}
  LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
  GENERATION_LIMIT: ${GENERATION_LIMIT:-20}
  GENERATION_WINDOW_SECONDS: ${GENERATION_WINDOW_SECONDS:-86400}
  LLM_REQUESTS_PER_SECOND: ${LLM_REQUESTS_PER_SECOND:-8}

services:
  postgres:
    restart: unless-stopped
    build: database
    environment:
      POSTGRES_USER: prepza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prepza"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  library-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/library/Dockerfile
      target: dev
    volumes: *library-source
    environment: *library-env

  library:
    <<: *service
    build:
      context: .
      dockerfile: services/library/Dockerfile
      target: dev
    volumes: *library-source
    environment: *library-env
    depends_on:
      library-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  notifications:
    restart: unless-stopped
    build:
      context: services/notifications
      target: dev
    volumes:
      - ./services/notifications/app:/service/app
    environment:
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-prepza. <no-reply@prepza.local>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SITE_URL: ${SITE_URL:-http://localhost:8090}
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit
    ports:
      # Web UI with every email sent locally.
      - "8125:8025"

  generation-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/generation/Dockerfile
      target: dev
    volumes: *generation-source
    environment: *generation-env

  generation:
    <<: *service
    build:
      context: .
      dockerfile: services/generation/Dockerfile
      target: dev
    volumes: *generation-source
    environment:
      <<: *generation-env
      # Re-generating a single question runs in the request, not in the worker.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
    depends_on:
      generation-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  generation-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/generation/Dockerfile
      target: dev
    volumes: *generation-source
    # A fresh process on every change: `arq --watch` restarts the worker but keeps the old code.
    command:
      - uv
      - run
      - --with
      - watchfiles
      - --no-sync
      - watchfiles
      - --filter
      - python
      - arq app.workers.generation.WorkerSettings
      - /services/generation/app
      - /packages/common/src
    environment:
      <<: *generation-env
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
    depends_on:
      generation-migrate:
        condition: service_completed_successfully
      library:
        condition: service_healthy

  rounds-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/rounds/Dockerfile
      target: dev
    volumes: *rounds-source
    environment: *rounds-env

  rounds:
    <<: *service
    build:
      context: .
      dockerfile: services/rounds/Dockerfile
      target: dev
    volumes: *rounds-source
    environment: *rounds-env
    depends_on:
      rounds-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  companies-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/companies/Dockerfile
      target: dev
    volumes: *companies-source
    environment: *companies-env

  companies:
    <<: *service
    build:
      context: .
      dockerfile: services/companies/Dockerfile
      target: dev
    volumes: *companies-source
    environment: *companies-env
    depends_on:
      companies-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      generation:
        condition: service_healthy
      library:
        condition: service_healthy
      rounds:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: frontend
      target: dev
    environment:
      # Server-side rendering calls the API through the gateway.
      API_URL: http://gateway
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    volumes:
      - ./frontend:/frontend
      - frontend-modules:/frontend/node_modules
      - frontend-next:/frontend/.next

  firebase-auth:
    restart: unless-stopped
    build: firebase
    ports:
      - "9199:9199"
      - "4100:4100"
    volumes:
      # Emulator users survive restarts, so the user ids stored in the databases stay valid.
      - firebase-data:/firebase/data
    # The emulator saves its users on a graceful stop; give it time to finish.
    stop_signal: SIGINT
    stop_grace_period: 30s

  gateway:
    restart: unless-stopped
    image: nginx:1.29-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      library:
        condition: service_healthy
      generation:
        condition: service_healthy
      rounds:
        condition: service_healthy
      companies:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres-data:
  firebase-data:
  frontend-modules:
  frontend-next:
