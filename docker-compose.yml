# Local development only. Every app image is built from its Dockerfile's `dev` target, with the
# source mounted so the servers reload on change. Production images come from the `prod` targets
# (see README); deploy them with your own orchestration.

x-firebase-env: &firebase-env
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
  # While set, the services accept unsigned tokens from the Auth emulator. Never in production.
  FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST}
  # Development only: serves /docs and /openapi.json, which `pnpm api-types` reads.
  API_DOCS: "true"
  # Salts user ids in funnel events; in Google Cloud it's a secret.
  ANALYTICS_SALT: local-analytics-salt
  # The key of each service, for tokens calling it; in Google Cloud each service has its own.
  LIBRARY_SERVICE_SECRET: ${SERVICE_SECRET}
  GENERATION_SERVICE_SECRET: ${SERVICE_SECRET}
  ROUNDS_SERVICE_SECRET: ${SERVICE_SECRET}
  COMPANIES_SERVICE_SECRET: ${SERVICE_SECRET}
  BILLING_SERVICE_SECRET: ${SERVICE_SECRET}
  NOTIFICATIONS_SERVICE_SECRET: ${SERVICE_SECRET}
  # Events go through the Pub/Sub emulator locally; Google Cloud uses the real service.
  GOOGLE_CLOUD_PROJECT: ${FIREBASE_PROJECT_ID}
  PUBSUB_EMULATOR_HOST: pubsub:8085
  # Error reports; nothing is sent while SENTRY_DSN is empty.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

x-service: &service
  restart: unless-stopped
  environment:
    <<: *firebase-env
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')
    interval: 10s
    timeout: 3s
    retries: 3

# Invite email limits, shared by library (shares) and companies (candidate invites).
x-email-limits: &email-limits
  EMAIL_HOURLY_LIMIT: ${EMAIL_HOURLY_LIMIT:-30}
  EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-200}
  EMAIL_RECIPIENT_DAILY_LIMIT: ${EMAIL_RECIPIENT_DAILY_LIMIT:-3}

x-library-env: &library-env
  <<: [*firebase-env, *email-limits]
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/library
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  ROUNDS_URL: http://rounds:8000
  GENERATION_URL: http://generation:8000
  COMPANIES_URL: http://companies:8000
  BILLING_URL: http://billing:8000
  NOTIFICATIONS_URL: http://notifications:8000

x-rounds-env: &rounds-env
  <<: *firebase-env
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/rounds
  REDIS_URL: redis://redis:6379
  LIBRARY_URL: http://library:8000
  BILLING_URL: http://billing:8000
  SERVICE_SECRET: ${SERVICE_SECRET}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
  LLM_LIMIT: ${LLM_LIMIT:-400}
  LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
  LLM_WINDOW_SECONDS: ${LLM_WINDOW_SECONDS:-3600}

x-billing-env: &billing-env
  <<: *firebase-env
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/billing
  SERVICE_SECRET: ${SERVICE_SECRET}
  PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
  PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
  PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
  PADDLE_PRICE_TOPUP_10: ${PADDLE_PRICE_TOPUP_10:-}
  PADDLE_PRICE_TOPUP_25: ${PADDLE_PRICE_TOPUP_25:-}
  PADDLE_PRICE_TOPUP_50: ${PADDLE_PRICE_TOPUP_50:-}
  PADDLE_PRICE_TOPUP_100: ${PADDLE_PRICE_TOPUP_100:-}
  PADDLE_PRICE_TOPUP_250: ${PADDLE_PRICE_TOPUP_250:-}
  PADDLE_PRICE_TOPUP_500: ${PADDLE_PRICE_TOPUP_500:-}
  PADDLE_PRICE_TOPUP_CUSTOM: ${PADDLE_PRICE_TOPUP_CUSTOM:-}
  PADDLE_PRICE_AUTO_TOP_UP: ${PADDLE_PRICE_AUTO_TOP_UP:-}
  PADDLE_API_KEY: ${PADDLE_API_KEY:-}

x-billing-source: &billing-source
  - ./services/billing/app:/services/billing/app
  - ./services/billing/migrations:/services/billing/migrations
  - ./services/billing/alembic.ini:/services/billing/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-companies-env: &companies-env
  <<: [*firebase-env, *email-limits]
  BILLING_URL: http://billing:8000
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/companies
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  GENERATION_URL: http://generation:8000
  LIBRARY_URL: http://library:8000
  ROUNDS_URL: http://rounds:8000

# Each service's mounted source; migrations read it too, so new ones run without a rebuild.
x-library-source: &library-source
  - ./services/library/app:/services/library/app
  - ./services/library/migrations:/services/library/migrations
  - ./services/library/alembic.ini:/services/library/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-generation-source: &generation-source
  - ./services/generation/app:/services/generation/app
  - ./services/generation/migrations:/services/generation/migrations
  - ./services/generation/alembic.ini:/services/generation/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-rounds-source: &rounds-source
  - ./services/rounds/app:/services/rounds/app
  - ./services/rounds/migrations:/services/rounds/migrations
  - ./services/rounds/alembic.ini:/services/rounds/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-companies-source: &companies-source
  - ./services/companies/app:/services/companies/app
  - ./services/companies/migrations:/services/companies/migrations
  - ./services/companies/alembic.ini:/services/companies/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-notifications-env: &notifications-env
  <<: *firebase-env
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/notifications
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  MAIL_FROM: ${MAIL_FROM:-prepza. <no-reply@prepza.local>}
  COMPANIES_URL: http://companies:8000
  LIBRARY_URL: http://library:8000
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SITE_URL: ${SITE_URL:-http://localhost:8090}

x-notifications-source: &notifications-source
  - ./services/notifications/app:/services/notifications/app
  - ./services/notifications/migrations:/services/notifications/migrations
  - ./services/notifications/alembic.ini:/services/notifications/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

# Runs a service's migrations once, before its API starts, so replicas never race on them.
x-migrate: &migrate
  restart: "no"
  command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
  depends_on:
    postgres:
      condition: service_healthy
    # Every API publishes events, so the topic must exist before any of them starts.
    pubsub-setup:
      condition: service_completed_successfully

x-generation-env: &generation-env
  <<: *firebase-env
  DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/generation
  REDIS_URL: redis://redis:6379
  LIBRARY_URL: http://library:8000
  BILLING_URL: http://billing:8000
  SERVICE_SECRET: ${SERVICE_SECRET}
  QUESTIONS_PER_TOPIC: ${QUESTIONS_PER_TOPIC:-100}
  LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
  VERIFY_REASONING_EFFORT: ${VERIFY_REASONING_EFFORT:-medium}
  GENERATION_LIMIT: ${GENERATION_LIMIT:-20}
  GENERATION_WINDOW_SECONDS: ${GENERATION_WINDOW_SECONDS:-86400}
  DAILY_GENERATION_LIMIT: ${DAILY_GENERATION_LIMIT:-0}
  LLM_REQUESTS_PER_SECOND: ${LLM_REQUESTS_PER_SECOND:-8}

services:
  postgres:
    restart: unless-stopped
    build: database
    environment:
      POSTGRES_USER: prepza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prepza"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  library-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/library/Dockerfile
      target: dev
    volumes: *library-source
    environment: *library-env

  library:
    <<: *service
    build:
      context: .
      dockerfile: services/library/Dockerfile
      target: dev
    volumes: *library-source
    environment: *library-env
    depends_on:
      library-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  notifications-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
      target: dev
    volumes: *notifications-source
    environment: *notifications-env

  notifications:
    <<: *service
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
      target: dev
    volumes: *notifications-source
    environment: *notifications-env
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Google's Pub/Sub emulator: events between services, pushed like in Google Cloud.
  pubsub:
    restart: unless-stopped
    image: google/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=${FIREBASE_PROJECT_ID}

  # Creates the topic and push subscriptions before the services start.
  pubsub-setup:
    restart: "no"
    image: curlimages/curl:8.17.0
    entrypoint: ["sh", "/pubsub-setup.sh"]
    volumes:
      - ./scripts/local/pubsub-setup.sh:/pubsub-setup.sh:ro
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      GOOGLE_CLOUD_PROJECT: ${FIREBASE_PROJECT_ID}
    depends_on:
      - pubsub

  # Local stand-in for Cloud Scheduler (see scripts/local/crontab).
  scheduler:
    restart: unless-stopped
    image: alpine:3.22
    # Cron reads only a crontab owned by root, so the mounted one is copied into place.
    command: sh -c "apk add --no-cache curl >/dev/null && cp /crontab /etc/crontabs/root && crond -f -l 2"
    volumes:
      - ./scripts/local/crontab:/crontab:ro
    depends_on:
      generation-worker:
        condition: service_healthy
      companies:
        condition: service_healthy

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit
    ports:
      # Web UI with every email sent locally.
      - "8125:8025"

  generation-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/generation/Dockerfile
      target: dev
    volumes: *generation-source
    environment: *generation-env

  generation:
    <<: *service
    build:
      context: .
      dockerfile: services/generation/Dockerfile
      target: dev
    volumes: *generation-source
    environment:
      <<: *generation-env
      # Re-generating a single question runs in the request, not in the worker.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
    depends_on:
      generation-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Runs jobs (Cloud Tasks in Google Cloud; called directly here) and scheduled work.
  generation-worker:
    <<: *service
    build:
      context: .
      dockerfile: services/generation/Dockerfile
      target: dev
    volumes: *generation-source
    command:
      [
        "uv", "run", "--no-sync", "uvicorn", "app.worker_main:app", "--host", "0.0.0.0",
        "--port", "8000", "--reload", "--reload-dir", "app", "--reload-dir", "/packages/common/src",
      ]
    environment:
      <<: *generation-env
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
    depends_on:
      generation-migrate:
        condition: service_completed_successfully
      library:
        condition: service_healthy

  rounds-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/rounds/Dockerfile
      target: dev
    volumes: *rounds-source
    environment: *rounds-env

  rounds:
    <<: *service
    build:
      context: .
      dockerfile: services/rounds/Dockerfile
      target: dev
    volumes: *rounds-source
    environment: *rounds-env
    depends_on:
      rounds-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  companies-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/companies/Dockerfile
      target: dev
    volumes: *companies-source
    environment: *companies-env

  companies:
    <<: *service
    build:
      context: .
      dockerfile: services/companies/Dockerfile
      target: dev
    volumes: *companies-source
    environment: *companies-env
    depends_on:
      companies-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      generation:
        condition: service_healthy
      library:
        condition: service_healthy
      rounds:
        condition: service_healthy

  billing-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: services/billing/Dockerfile
      target: dev
    volumes: *billing-source
    environment: *billing-env

  billing:
    <<: *service
    build:
      context: .
      dockerfile: services/billing/Dockerfile
      target: dev
    volumes: *billing-source
    environment: *billing-env
    depends_on:
      billing-migrate:
        condition: service_completed_successfully

  frontend:
    restart: unless-stopped
    build:
      context: frontend
      target: dev
    environment:
      # Server-side rendering calls the API through the gateway.
      API_URL: http://gateway
      SITE_URL: ${SITE_URL:-http://localhost:8090}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    volumes:
      - ./frontend:/frontend
      - frontend-modules:/frontend/node_modules
      - frontend-next:/frontend/.next

  firebase-auth:
    restart: unless-stopped
    build: firebase
    ports:
      - "9199:9199"
      - "4100:4100"
    volumes:
      # Emulator users survive restarts, so the user ids stored in the databases stay valid.
      - firebase-data:/firebase/data
    # The emulator saves its users on a graceful stop; give it time to finish.
    stop_signal: SIGINT
    stop_grace_period: 30s

  gateway:
    restart: unless-stopped
    image: nginx:1.29-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      library:
        condition: service_healthy
      generation:
        condition: service_healthy
      rounds:
        condition: service_healthy
      companies:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres-data:
  firebase-data:
  frontend-modules:
  frontend-next:
