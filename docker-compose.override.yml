# Local development. Compose loads this file automatically.
# Source is mounted into the containers, and the servers reload on change.

x-reload: &reload
  WATCHFILES_FORCE_POLLING: "true"
  # Only here: while set, the services accept unsigned tokens from the Auth emulator.
  FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST}

x-api: &api
  command:
    - sh
    - -c
    - uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
  environment:
    <<: *reload

services:
  library:
    <<: *api
    volumes:
      - ./services/library/app:/service/app
      - ./services/library/migrations:/service/migrations
      - ./services/library/alembic.ini:/service/alembic.ini:ro

  generation:
    <<: *api
    volumes:
      - ./services/generation/app:/service/app
      - ./services/generation/migrations:/service/migrations
      - ./services/generation/alembic.ini:/service/alembic.ini:ro

  generation-worker:
    command:
      - uv
      - run
      - --with
      - watchfiles
      - --no-sync
      - arq
      - app.workers.generation.WorkerSettings
      - --watch
      - /service/app
    environment:
      <<: *reload
    volumes:
      - ./services/generation/app:/service/app

  rounds:
    <<: *api
    volumes:
      - ./services/rounds/app:/service/app
      - ./services/rounds/migrations:/service/migrations
      - ./services/rounds/alembic.ini:/service/alembic.ini:ro

  companies:
    <<: *api
    volumes:
      - ./services/companies/app:/service/app
      - ./services/companies/migrations:/service/migrations
      - ./services/companies/alembic.ini:/service/alembic.ini:ro

  notifications:
    command:
      - uv
      - run
      - --with
      - watchfiles
      - --no-sync
      - watchfiles
      - --filter
      - python
      - python -m app.main
      - /service/app
    environment:
      <<: *reload
    volumes:
      - ./services/notifications/app:/service/app

  frontend:
    build:
      context: frontend
      target: dev
    command:
      - pnpm
      - exec
      - next
      - dev
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
      - --webpack
    environment:
      API_URL: http://gateway
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL}
    volumes:
      - ./frontend:/frontend
      - frontend-modules:/frontend/node_modules
      - frontend-next:/frontend/.next

volumes:
  frontend-modules:
  frontend-next:
